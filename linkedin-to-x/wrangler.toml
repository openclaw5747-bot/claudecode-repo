name = "linkedin-to-x"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Serve on your subdomain. Replace with your own; the domain must be on Cloudflare DNS.
# routes = [{ pattern = "hooks.example.com", custom_domain = true }]

# Remembers which LinkedIn drafts were already handled.
# Create with: npx wrangler kv namespace create STATE  → paste the id below.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
PUBLISH_AT = "next-free-slot"   # or "now", or "" to only save drafts
TAG = "auto-repurposed"         # Typefully tag on created X drafts; "" for none
REPURPOSER = "http"
REPURPOSER_URL = ""             # set once the repurposing service is chosen
REPURPOSER_RESPONSE_FIELD = "text"
# SOCIAL_SET_ID = ""            # optional: only act on this Typefully account

# Secrets (never commit these): set with `npx wrangler secret put <NAME>`
#   TYPEFULLY_API_KEY, WEBHOOK_SECRET, REPURPOSER_API_KEY
