<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello from Claude</title>
  <style>
    :root {
      --bg: #faf9f5;
      --fg: #1f1e1d;
      --muted: #6b6a66;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1e1d;
        --fg: #faf9f5;
        --muted: #a8a69f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 600;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Claude</h1>
    <p>Welcome to this simple landing page.</p>
  </main>
</body>
</html>
